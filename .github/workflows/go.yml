name: Go checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: test -z "$(gofmt -l cmd/jobrunner jobrunnerclient jobconfig jobprogress)"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Test Windows job locking
        run: go test ./cmd/jobrunner -run '^TestJobLock' -count=1 -timeout=30s

name: Go checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: test -z "$(gofmt -l cmd/jobrunner/main.go cmd/jobrunner/files.go cmd/jobrunner/files_test.go jobrunnerclient/client.go jobconfig/config.go jobconfig/config_test.go)"

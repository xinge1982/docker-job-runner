name: Go checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: gofmt -w jobconfig/config.go jobconfig/config_test.go
      - uses: actions/upload-artifact@v4
        with:
          name: go-module-files
          path: |
            go.mod
            go.sum
            jobconfig/config.go
            jobconfig/config_test.go
      - run: go test ./...
      - run: test -z "$(gofmt -l jobconfig/config.go jobconfig/config_test.go)"

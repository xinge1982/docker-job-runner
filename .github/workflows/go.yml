name: Go checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -w cmd/jobrunner/main.go cmd/jobrunner/lifecycle.go cmd/jobrunner/lifecycle_test.go jobrunnerclient/client.go
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-lifecycle
          path: |
            cmd/jobrunner/main.go
            cmd/jobrunner/lifecycle.go
            cmd/jobrunner/lifecycle_test.go
            jobrunnerclient/client.go
      - run: go test ./...
      - run: test -z "$(gofmt -l cmd/jobrunner/main.go cmd/jobrunner/files.go cmd/jobrunner/files_test.go jobrunnerclient/client.go jobconfig/config.go jobconfig/config_test.go)"
